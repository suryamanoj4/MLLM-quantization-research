[project]
name = "experiments"
version = "0.1.0"
description = "Lexical Fallback in Quantized MLLMs — evidence study (POPE + CHAIR, FP16/W8A8/W4A16/W4A8/W4A4)"
readme = "README.md"
authors = [
    { name = "Team Phoenix", email = "phoenix@iiit.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.33,<1.0",
    "auto-gptq>=0.7.1",
    "bitsandbytes>=0.43",
    "huggingface-hub>=0.24,<1.0",
    "matplotlib>=3.8",
    "numpy>=1.26,<2.0",
    "optimum==1.23.3",
    "optimum-quanto>=0.2.4,<0.2.7",
    "peft==0.12.0",
    "pillow>=10.0",
    "protobuf>=4.25,<5.0",
    "sentencepiece>=0.1.99",
    "pyyaml>=6.0",
    "requests>=2.31",
    "safetensors>=0.4.3",
    "scipy>=1.12",
    "setuptools>=65",
    "torch>=2.4,<2.6",
    "torchao>=0.4,<0.8",
    "tqdm>=4.66",
    "transformers>=4.44,<4.47",
]


[project.scripts]
experiments = "experiments.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
