[project]
name = "experiments"
version = "0.1.0"
description = "Lexical Fallback in Quantized MLLMs — evidence study (POPE + CHAIR, FP16/W8/W4)"
readme = "README.md"
authors = [
    { name = "Team Phoenix", email = "phoenix@iiit.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.33",
    "auto-gptq>=0.7.1",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "safetensors>=0.4.3",
    "scipy>=1.12",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.44",
]

[project.scripts]
experiments = "experiments.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
